name: IndexNow auto-ping

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITEMAP_URL: https://prop-firm-risk-calculator.vercel.app/sitemap.xml
      KEY: 56bcaddb7c164037ba72a77030ec31c1
    steps:
      - name: Fetch live sitemap and ping IndexNow
        run: |
          set -e
          UA="Mozilla/5.0 (compatible; IndexNow-github-action/1.0)"
          xml=$(curl -fsSL -A "$UA" "$SITEMAP_URL")
          urls=$(printf '%s' "$xml" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' | tr -d ' \r')
          if [ -z "$urls" ]; then
            echo "::error::No <loc> entries found in $SITEMAP_URL"
            exit 1
          fi
          first=$(printf '%s' "$urls" | head -n1)
          origin=$(printf '%s' "$first" | grep -oE '^https?://[^/]+' | head -n1)
          if [ -z "$origin" ]; then
            echo "::error::Could not derive origin from $first"
            exit 1
          fi
          host=$(printf '%s' "$origin" | sed -E 's#^https?://##')
          key_location="$origin/$KEY.txt"
          list=$(printf '%s' "$urls" | python3 -c 'import sys,json
          lines=[l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps(list(lines)))')
          payload=$(python3 - "$host" "$KEY" "$key_location" "$list" <<'PY'
          import sys, json
          host, key, key_location = sys.argv[1], sys.argv[2], sys.argv[3]
          url_list = json.loads(sys.argv[4])
          print(json.dumps({"host": host, "key": key, "keyLocation": key_location, "urlList": url_list}))
PY
)
          if [ -z "$payload" ]; then
            echo "::error::JSON payload build failed"
            exit 1
          fi
          echo "$payload" > /tmp/indexnow.json
          code=$(curl -sS -o /tmp/indexnow-resp.txt -w '%{http_code}' \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @/tmp/indexnow.json)
          echo "IndexNow HTTP $code"
          cat /tmp/indexnow-resp.txt
          if [ "$code" != "200" ]; then
            echo "::error::IndexNow ping failed with HTTP $code"
            exit 1
          fi